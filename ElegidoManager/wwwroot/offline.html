<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Sin conexión · ELEGIDO MANAGER</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0b; color: #f3efe6; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        .c { text-align: center; max-width: 380px; padding: 2rem; }
        img { width: 72px; height: 72px; }
        h1 { color: #ecd593; font-size: 1.35rem; margin: 1rem 0 .4rem; }
        p { color: #9b978d; line-height: 1.5; margin: 0; }
        button { margin-top: 1.4rem; padding: .8rem 1.8rem; border: 0; border-radius: 12px; background: linear-gradient(145deg, #e6c66f, #b48b2f); color: #0a0a0b; font-weight: 700; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="c">
        <img src="/img/logo.svg" alt="" />
        <h1>Sin conexión a internet</h1>
        <p>ELEGIDO MANAGER necesita internet para mostrarte la información al día. Revisa tu señal o WiFi.</p>
        <button type="button" id="reintentar">Reintentar</button>
    </div>
    <script>document.getElementById('reintentar').addEventListener('click', () => location.reload());</script>
</body>
</html>
